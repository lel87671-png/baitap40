<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - LE QUANG LONG (231A011163)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .profile-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #007bff;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0 5px 0;
            color: #2c3e50;
        }
        .info {
            color: #555;
            font-size: 15px;
            margin: 6px 0;
        }
        .menu {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-btn {
            text-decoration: none;
            background-color: #007bff;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: block;
            font-size: 15px;
        }
        .menu-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .btn-lantern {
            background-color: #e67e22;
        }
        .btn-lantern:hover {
            background-color: #d35400;
        }
        .btn-game {
            background-color: #27ae60;
        }
        .btn-game:hover {
            background-color: #219150;
        }

        /* Giao diện Popup/Modal xem hình bài 38 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 35px;
            color: #fff; font-size: 40px; font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Ảnh đại diện của bạn -->
        <img src="anh avt.jpg" alt="Ảnh sinh viên" class="avatar">
        <h1>LE QUANG LONG</h1>
        <div class="info"><strong>Mã số sinh viên:</strong> 231A011163</div>
        <div class="info"><strong>Ngành học:</strong> Công nghệ thông tin</div>

        <div class="menu">
            <!-- Nút bấm mở hình kết quả Bài tập 38 -->
            <button class="menu-btn" onclick="openModal()">📄 Kết quả Bài tập 38</button>
            
            <!-- Link trỏ đến trang Đèn kéo quân của Bài tập 39 -->
            <a href="lantern.html" class="menu-btn btn-lantern">🏮 Bài tập 39: Đèn Kéo Quân 3D</a>

            <!-- Link trỏ đến trang Mini Game Hứng Táo của Bài tập 40 -->
            <a href="game.html" class="menu-btn btn-game">🎮 Bài tập 40: Mini Game Hứng Táo</a>
        </div>
    </div>

    <!-- Hộp thoại Modal chứa hình kết quả Bài tập 38 -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img class="modal-content" src="bt38_result.png" alt="Kết quả Bài tập 38" onclick="event.stopPropagation()">
    </div>

    <script>
        function openModal() {
            document.getElementById('imageModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>

</body>
</html>
