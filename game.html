<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT40 - Mini Game Hứng Táo</title>
    <style>
        body {
            background-color: #eef2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .header-nav {
            margin-bottom: 15px;
        }
        .header-nav a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        #game-info {
            width: 500px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        /* Đảm bảo khung game đúng 500px x 400px theo yêu cầu đề bài */
        #game-container {
            width: 500px;
            height: 400px;
            border: 3px solid #222;
            border-radius: 12px;
            background-color: #f0f8ff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }
        /* Giỏ hứng ở đáy màn hình */
        #basket {
            width: 80px;
            height: 20px;
            background-color: #8B4513;
            position: absolute;
            bottom: 10px;
            left: 210px;
            border-radius: 6px;
        }
        /* Quả táo rơi tự do */
        #apple {
            width: 26px;
            height: 26px;
            background-color: #e74c3c;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 237px;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.2);
        }
        #start-btn {
            margin-top: 20px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
        #start-btn:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="index.html">⬅ Quay lại Trang chủ</a>
    </div>

    <div id="game-info">
        <div>Điểm số: <span id="score">0</span></div>
        <div>Mạng sống: <span id="lives">3</span></div>
    </div>

    <div id="game-container">
        <div id="basket"></div>
        <div id="apple"></div>
    </div>

    <button id="start-btn" onclick="startGame()">Bắt đầu</button>

    <script>
        const gameContainer = document.getElementById('game-container');
        const basket = document.getElementById('basket');
        const apple = document.getElementById('apple');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let lives = 3;
        let gameInterval = null;
        let basketX = 210;
        let appleX = 237;
        let appleY = 0;
        let appleSpeed = 3;
        let isPlaying = false;

        // Điều khiển giỏ bằng phím mũi tên Trái/Phải không cho vượt ra ngoài khung (0 đến 420px)
        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft') {
                basketX -= 25;
                if (basketX < 0) basketX = 0;
            } else if (e.key === 'ArrowRight') {
                basketX += 25;
                if (basketX > 420) basketX = 420; // 500 - 80 = 420
            }
            basket.style.left = basketX + 'px';
        });

        function startGame() {
            score = 0;
            lives = 3;
            appleSpeed = 3;
            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            startBtn.style.display = 'none';
            isPlaying = true;
            
            resetApple();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 20);
        }

        function resetApple() {
            appleY = 0;
            // Tọa độ ngẫu nhiên trên trục hoành (left) trong khoảng 0 đến 474px
            appleX = Math.floor(Math.random() * 474);
            apple.style.left = appleX + 'px';
        }

        function updateGame() {
            // Táo rơi tự do
            appleY += appleSpeed;
            apple.style.top = appleY + 'px';

            // Xử lý va chạm
            if (appleY >= 364) {
                // Va chạm thành công với giỏ
                if (appleX + 26 >= basketX && appleX <= basketX + 80) {
                    score++;
                    scoreDisplay.textContent = score;
                    appleSpeed += 0.2; // Tăng tốc độ rơi nhẹ
                    resetApple();
                } 
                // Không hứng được -> rơi quá đáy
                else if (appleY >= 380) {
                    lives--;
                    livesDisplay.textContent = lives;
                    if (lives <= 0) {
                        endGame();
                    } else {
                        resetApple();
                    }
                }
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            alert("Game Over! Điểm số của bạn là: " + score);
            startBtn.style.display = 'block';
        }
    </script>
</body>
</html>
